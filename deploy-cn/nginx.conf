# ============================================================
#  个人工作台 · Nginx 反代配置（国内服务器）
#  作用：把域名 80/443 请求转发到本地 Node 服务（server.js 监听 8080）
#  配套：deploy-cn/README-CN.md
# ============================================================

# ---------- HTTP 80：重定向到 HTTPS + 证书验证通道 ----------
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 等申请证书时用，平时可留空目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部 301 跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 443：反代到本地 Node ----------
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # 证书（用阿里云/腾讯云免费 DV 证书，或 certbot 申请的）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 安全加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # gzip 压缩（省流量、提速前端资源）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # PWA / 静态资源：长缓存
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|webmanifest)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 主请求：反代到本地 Node（支持 WebSocket，供 Supabase Realtime / 自建同步长轮询）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
