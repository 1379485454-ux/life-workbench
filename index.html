<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>个人工作台 · My Workbench</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="工作台">
  <meta name="format-detection" content="telephone=no">
  <meta name="application-name" content="工作台">
  <meta name="msapplication-TileColor" content="#2563eb">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="preload" href="css/style.css" as="style">
  <link rel="preload" href="js/sync.js" as="script">
  <link rel="preload" href="js/app.js" as="script">
  <link rel="preload" href="js/charts.js" as="script">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 极光流动背景 -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-1"></span>
    <span class="aurora-blob aurora-2"></span>
    <span class="aurora-blob aurora-3"></span>
    <span class="aurora-grid"></span>
  </div>

  <div class="app">
    <!-- ========== 左侧导航栏 ========== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9M5 10v10h14V10"/></svg></span>
        <span class="logo-text">个人工作台</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <!-- 底部游戏化状态 -->
      <div class="sidebar-stats" id="sidebarStats"></div>
    </aside>

    <!-- ========== 主内容区 ========== -->
    <main class="main">
      <header class="main-header" id="mainHeader"></header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- ========== 悬浮提示 ========== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========== 彩带庆祝层 ========== -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <script src="js/sync.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
